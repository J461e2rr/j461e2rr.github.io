<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#000000">
<title>J4J4J4</title>
<style>
  :root { --font: Arial, Helvetica, sans-serif; }
  html, body { margin: 0; height: 100%; background: #000; font: 12px/1.2 var(--font); color: #fff; }
  html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; overflow-x: hidden; overflow-y: hidden; scrollbar-width: none; }
  html.scrolly { overflow-y: auto; }
  html::-webkit-scrollbar { display: none; }

  /* ---- page 2: INFO / HISTORY / FUTURE ---- */
  #p2 { position: absolute; left: 0; top: 100vh; width: 100%; height: 100vh; z-index: 2; display: none; opacity: 0; pointer-events: none; }
  .pi { position: absolute; transform: translate(-50%, -50%); }
  .pi[aria-expanded="true"] { border-color: #fff; }
  #card { position: absolute; left: 50%; top: 56%; width: min(380px, 88vw); box-sizing: border-box; padding: 14px;
          background: #000; border: 1px solid #fff; border-radius: 0;
          transform: translate(-50%, -50%); visibility: hidden; }
  /* before the play button is pressed the frame is an empty white box with a play triangle and a speaker */
  #card.locked { height: 250px; }
  #card.locked .ch, #card.locked .body { display: none; }
  #card .cover { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; gap: 12px; }
  #card.locked .cover { display: flex; }
  #card .cover button { background: none; border: 0; padding: 4px; cursor: pointer; display: block; }
  #card .cover .big { width: 44px; height: 44px; }
  #card .cover .small { width: 22px; height: 22px; opacity: .8; }
  #card .reveal { animation: fadein .5s ease-out 1; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  #card.jelly { animation: jelly .7s cubic-bezier(.3, 1.4, .5, 1) 1; }
  #card.playing { animation: breathe 2.8s ease-in-out infinite; }
  @keyframes jelly {
    0%   { transform: translate(-50%, -50%) scale(.35, .35); }
    35%  { transform: translate(-50%, -50%) scale(1.14, .88); }
    55%  { transform: translate(-50%, -50%) scale(.94, 1.07); }
    75%  { transform: translate(-50%, -50%) scale(1.03, .98); }
    100% { transform: translate(-50%, -50%) scale(1, 1); }
  }
  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1, 1); }
    50%      { transform: translate(-50%, -50%) scale(1.025, .98); }
  }
  @keyframes sway {
    0%, 100% { transform: scale(1, 1) rotate(0deg); }
    50%      { transform: scale(.96, 1.05) rotate(-1.5deg); }
  }
  #card .ch { display: flex; gap: 12px; align-items: flex-start; }
  #card .ch img { width: 84px; height: 84px; object-fit: cover; border-radius: 0; flex: none; display: block; background: #222; }
  #card.playing .ch img { animation: sway 3.2s ease-in-out infinite; }
  #card h2 { margin: 0 0 4px; font: 18px/1.1 var(--font); }
  #card .sub { margin: 0 0 10px; color: #aaa; }
  #card .btns { display: flex; gap: 6px; align-items: center; }
  #card .btns button { background: #fff; border: 1px solid #111; border-radius: 0; padding: 4px 10px; cursor: pointer; font: 12px/1.2 var(--font); }
  #card .btns button:disabled { opacity: .35; cursor: default; }
  #card .btns svg { display: block; width: 14px; height: 14px; }
  #card .note { margin: 6px 0 0; color: #999; }
  #card .body { margin: 14px 0 0; font: 13px/1.45 var(--font); }
  /* the Spotify player: its own little object, dropped at a random spot near the frame */
  #sphost { position: absolute; left: 0; top: 0; width: 300px; height: 80px; z-index: 3; opacity: 0; pointer-events: none;
            transform: scale(.08); transform-origin: center;
            transition: left .22s cubic-bezier(.2, 1.5, .4, 1), top .22s cubic-bezier(.2, 1.5, .4, 1), transform .22s cubic-bezier(.2, 1.5, .4, 1), opacity .06s linear; }
  #sphost.on { opacity: 1; pointer-events: auto; transform: scale(1); }
  #sphost iframe { display: block; border: 0; border-radius: 0 !important; }
  #sphost.drag { transition: opacity .06s linear, transform .22s cubic-bezier(.2, 1.5, .4, 1); }
  #sphandle { position: absolute; left: 0; top: -15px; width: 100%; height: 15px; line-height: 15px; text-align: center;
              background: #000; color: #999; font-size: 10px; cursor: grab; user-select: none; touch-action: none; }
  #sphost.drag #sphandle { cursor: grabbing; }
  #scrollhint { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; color: #aaa; pointer-events: none; opacity: 0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  button { font: inherit; color: inherit; }

  #show, #hub, .node, .pi {
    font: 12px/1.2 var(--font); letter-spacing: 0; text-transform: none;
    color: #fff; background: #000; border: 1px solid transparent; border-radius: 0;
    padding: 2px 4px; margin: 0; cursor: pointer; white-space: nowrap; text-decoration: none;
  }
  button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  /* fingers need bigger targets than a mouse */
  @media (pointer: coarse) {
    #show, #hub, .node, .pi { padding: 8px 10px; font-size: 13px; }
    .img { padding: 5px; }
  }
  @media (max-width: 520px) {
    .img { width: 84px; height: 84px; }
    .img.big { width: 170px; height: 170px; }
    #card { padding: 12px; }
    #card .ch img { width: 72px; height: 72px; }
  }
  #show { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; background: none; }
  #show:hover { text-decoration: underline; }
  #show.hidden { visibility: hidden; }

  #hub { position: fixed; left: 50%; top: 50%; z-index: 3; transform: translate(-50%, -50%);
         opacity: 0; visibility: hidden; pointer-events: none; }
  #hub.pop { animation: pop .14s steps(4) 1; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(2.2); } to { transform: translate(-50%, -50%) scale(1); } }

  #hl { position: fixed; left: 50%; top: 50%; z-index: 3; margin: 0; padding: 2px 4px; background: #000;
        border: 0; color: #fff; cursor: pointer;
        font: 12px/1.2 var(--font); text-align: center; white-space: nowrap;
        transform: translate(-50%, -50%); visibility: hidden; pointer-events: none; }
  .text { cursor: default; }

  .node { position: fixed; left: 0; top: 0; z-index: 2; opacity: 0; will-change: transform, opacity; }
  .link { text-decoration: underline; }
  .dead { color: #777; cursor: default; }
  .focus { border-color: #fff !important; }
  #hub:focus-visible, .node:focus-visible { outline: 1px dotted #fff; }

  .img { width: 96px; height: 96px; box-sizing: border-box; padding: 5px; background: #fff; border: 0; overflow: hidden; }
  .img > span { display: block; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  .img.big { width: 230px; height: 230px; }
  .img.big img { filter: saturate(1.8) contrast(1.25); }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  #lb { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.94); cursor: zoom-out; }
  #lb.on { display: flex; }
  #lb img { max-width: 82vw; max-height: 82vh; background: #fff; padding: 8px; border: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="show" type="button">show</button>
<button id="hub" type="button" aria-expanded="false">J4J4J4</button>
<button id="hl" type="button">I'm a content creator, bitch</button>
<div id="scrollhint">scroll down</div>
<div id="p2">
  <div id="sphost"><div id="sphandle">drag</div></div>
  <article id="card" class="locked" aria-live="polite">
    <div class="cover">
      <button type="button" id="bigplay" aria-label="play"><svg class="big" viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z" fill="#d9d9d9"/></svg></button>
      <button type="button" id="bigsnd" aria-label="sound on/off"><svg class="small" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="s-on" d="M11.5 5.5a3.5 3.5 0 0 1 0 5M13 3.5a6 6 0 0 1 0 9"/><path class="s-off" d="M11 5l4 6M15 5l-4 6" style="display:none"/></svg></button>
    </div>
    <div class="ch">
      <img alt="">
      <div>
        <h2></h2>
        <p class="sub"></p>
      </div>
    </div>
    <p class="body"></p>
  </article>
</div>
<div id="lb"><img alt=""></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('show');
  const hub = document.getElementById('hub');
  const FONT = 'Arial, Helvetica, sans-serif';

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // page 2 sits exactly one real screen below (100vh is unreliable on phones with a moving address bar)
    const p2el = document.getElementById('p2');
    p2el.style.top = H + 'px'; p2el.style.height = H + 'px';
    relayout();
  }

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
  const easeInExpo = t => t <= 0 ? 0 : Math.pow(2, 10 * (t - 1));
  const easeOutBack = t => { const c = 2.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // ================= intro (seconds after click on "show") =================
  const T_SHAKE = 0.6;
  const T_BURST = T_SHAKE + 0.75;
  const T_COUNT = T_BURST + 0.45;
  const STEP = 0.55;
  const T_GATHER = T_COUNT + 4 * STEP + 0.5;
  const D_GATHER = 0.4;                          // slams into the centre
  const T_HUB = T_GATHER + D_GATHER * 0.5;       // the phrase appears while the digits are still landing

  let started = false, t0 = 0, hubReady = false, introDone = false, morphing = false;
  const hl = document.getElementById('hl');

  // click on the phrase: it vanishes at once and the menu flies out of the centre
  hl.addEventListener('click', () => {
    if (morphing) return;
    morphing = true;
    hl.style.visibility = 'hidden';
    hl.style.pointerEvents = 'none';
    hubReady = true;
    hub.style.visibility = 'visible';
    hub.style.pointerEvents = 'auto';
    hub.classList.add('pop');
    openMenu();
  });
  let particles = [];
  let word = null;

  // ================= background: wavy dot grid =================
  const GAP = 26;
  // every piece of text bends the dot grid around it, like a lens / black hole
  function gatherLenses() {
    const L = [];
    const add = (x, y, w, h, s) => { if (s > 0.05) L.push({ x, y, a: w / 2 + 34, b: h / 2 + 34, s }); };
    if (!started) { const r = btn.getBoundingClientRect(); add(r.left + r.width / 2, r.top + r.height / 2, r.width, r.height, 1); }
    if (hl.style.visibility === 'visible') add(W / 2, H / 2, hl.offsetWidth, hl.offsetHeight, 1);
    if (hubReady) add(W / 2, H / 2, hub.offsetWidth, hub.offsetHeight, hubDim * pageFade);
    for (const n of nodes) add(n.dx, n.dy, n.w, n.h, n.s * n.dim * pageFade);
    if (p2Fade > 0.05) {
      p2.querySelectorAll('.pi, #card').forEach(el => {
        if (el.id === 'card' && getComputedStyle(el).visibility === 'hidden') return;
        const r = el.getBoundingClientRect();
        add(r.left + r.width / 2, r.top + r.height / 2, r.width, r.height, p2Fade);
      });
    }
    return L;
  }

  function drawDots(t) {
    ctx.fillStyle = '#fff';
    const lenses = gatherLenses();
    const cols = Math.ceil(W / GAP) + 1, rows = Math.ceil(H / GAP) + 1;
    const ox = (W - (cols - 1) * GAP) / 2, oy = (H - (rows - 1) * GAP) / 2;
    const cx = W / 2, cy = H / 2;
    for (let j = 0; j < rows; j++) {
      const y0 = oy + j * GAP;
      for (let i = 0; i < cols; i++) {
        const x0 = ox + i * GAP;
        const d = Math.hypot(x0 - cx, y0 - cy);
        const v = Math.sin(d * 0.012 - t * 1.1)
                + Math.sin(x0 * 0.009 + t * 0.7)
                + Math.sin(y0 * 0.011 - t * 0.55 + x0 * 0.004);
        const k = (v + 3) / 6;
        let x = x0, y = y0, grow = 1, boost = 0;
        for (const l of lenses) {
          const dx = x0 - l.x, dy = y0 - l.y;
          const e2 = (dx * dx) / (l.a * l.a) + (dy * dy) / (l.b * l.b);
          if (e2 > 9) continue;
          const g = Math.exp(-e2 * 0.9) * l.s;
          x += dx * g * 0.7;          // pushed outward = magnified
          y += dy * g * 0.7;
          grow += g * 2.2;            // and the dots swell
          boost += g * 0.25;
        }
        ctx.globalAlpha = Math.min(0.8, 0.06 + k * 0.3 + boost);
        ctx.beginPath();
        ctx.arc(x, y, (0.3 + k * k * 0.85) * grow, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ================= intro: show -> 5s -> 4-3-2-1 -> centre =================
  function start() {
    if (started) return;
    started = true;
    const r = btn.getBoundingClientRect();
    const cs = getComputedStyle(btn);
    word = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, font: `${cs.fontSize} ${FONT}` };
    btn.classList.add('hidden');

    const pw = Math.ceil(r.width + 40), ph = Math.ceil(r.height + 40);
    const off = document.createElement('canvas');
    off.width = pw; off.height = ph;
    const o = off.getContext('2d');
    o.font = word.font; o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText('show', pw / 2, ph / 2);
    const data = o.getImageData(0, 0, pw, ph).data;
    const pts = [];
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++)
      if (data[(y * pw + x) * 4 + 3] > 90) pts.push([x - pw / 2, y - ph / 2]);

    const N = 10;
    const cx = W / 2, cy = H / 2;
    particles = [];
    for (let n = 0; n < N; n++) {
      const p = pts[(Math.random() * pts.length) | 0] || [0, 0];
      const ang = Math.random() * 6.2832;
      const rad = 0.3 + Math.random() * 0.7;
      particles.push({
        hx: word.cx + p[0] - cx, hy: word.cy + p[1] - cy,
        tx: Math.cos(ang) * rad * 150,
        ty: Math.sin(ang) * rad * 150,
        size: 16 + Math.random() * 10,
        alpha: 0.5 + Math.random() * 0.5,
        delay: Math.random() * 0.2,
        ph1: Math.random() * 6.28, ph2: Math.random() * 6.28,
        fr: 0.8 + Math.random() * 1.2,
        fx: (Math.random() - .5) * 14, fy: (Math.random() - .5) * 14,
        burstDelay: Math.random() * 0.12,
        gatherDelay: Math.random() * 0.1
      });
    }
    t0 = performance.now() / 1000;
  }
  btn.addEventListener('click', start);

  function drawIntro(t) {
    const s = t - t0;
    const cx = W / 2, cy = H / 2;

    // the headline appears at once where the digits landed
    if (!introDone && s >= T_HUB) {
      introDone = true;
      hl.style.visibility = 'visible';
      hl.style.pointerEvents = 'auto';
    }
    if (s > T_GATHER + D_GATHER + 0.2) return;   // digits are gone; before that they keep flying in

    // word trembles harder and harder, then bursts
    if (s < T_SHAKE + 0.08) {
      const u = clamp(s / T_SHAKE);
      const amp = 0.5 + u * u * 6;
      ctx.save();
      ctx.globalAlpha = s < T_SHAKE ? 1 : 0;
      ctx.fillStyle = '#fff';
      ctx.font = word.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const jx = (Math.sin(s * 131) + Math.sin(s * 197 + 1)) * amp * 0.5;
      const jy = (Math.sin(s * 163 + 2) + Math.sin(s * 241 + 3)) * amp * 0.5;
      ctx.fillText('show', word.cx + jx, word.cy + jy);
      ctx.restore();
    }

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of particles) {
      if (s < T_SHAKE) continue;

      const bu = clamp((s - T_SHAKE - p.burstDelay) / (T_BURST - T_SHAKE - 0.12));
      const be = easeOutExpo(bu);
      let x = lerp(p.hx, p.tx, be);
      let y = lerp(p.hy, p.ty, be);

      // sharp tremble that dies down, then a small drift
      const trem = (1 - be) * 10 + (1 - bu) * 2;
      x += Math.sin(s * 90 * p.fr + p.ph1) * trem + Math.sin(s * p.fr + p.ph1) * 2 * bu;
      y += Math.cos(s * 97 * p.fr + p.ph2) * trem + Math.cos(s * 0.9 * p.fr + p.ph2) * 2 * bu;

      // abrupt, straight, upright pull to the centre; the closer, the more transparent
      let fade = 1;
      if (s > T_GATHER) {
        const gu = clamp((s - T_GATHER - p.gatherDelay) / D_GATHER);
        const ge = easeInExpo(gu);
        x = x * (1 - ge) + p.fx * ge;
        y = y * (1 - ge) + p.fy * ge;
        fade = 1 - gu;
      }

      let digit = 5, pop = 1;
      const cs = s - T_COUNT - p.delay;
      if (cs >= 0) {
        const step = Math.min(4, Math.floor(cs / STEP) + 1);
        digit = Math.max(1, 5 - step);
        const within = cs - (step - 1) * STEP;
        if (cs < 4 * STEP) pop = 1 + 0.7 * (1 - easeOutBack(clamp(within / 0.18)));
      }

      ctx.globalAlpha = p.alpha * fade;
      ctx.font = `${p.size * pop}px ${FONT}`;
      ctx.fillText(digit, cx + x, cy + y);
    }
    ctx.globalAlpha = 1;
  }

  // ================= menu =================
  const q = s => '"' + s + '"';
  const TREE = [
    { label: 'ROBLOX', kids: [
      { t: 'link', label: q('J461e2rr team'), href: 'https://www.roblox.com/communities/35154220/J461e2rr-team#!/about' },
      { t: 'link', label: q('Studio.PNG'),     href: 'https://www.roblox.com/communities/1090974271/Studio-png#!/about' }
    ]},
    { label: 'GODOT ENGINE', kids: [
      { t: 'dead', label: 'NOT YET' }
    ]},

  function makeNode(def, parent, depth, delay) {
    let el;
    if (def.t === 'link') {
      el = document.createElement('a');
      el.href = def.href; el.target = '_blank'; el.rel = 'noopener noreferrer';
      el.className = 'node link';

    } else if (def.t === 'dead' || def.t === 'text') {
      el = document.createElement('span');
      el.className = 'node ' + (def.t === 'dead' ? 'dead' : 'text');
      el.textContent = def.label;
    } else if (def.t === 'img') {
      el = document.createElement('button'); el.type = 'button';
      el.className = 'node img' + (def.big ? ' big' : '');
      const wrap = document.createElement('span');
      const im = document.createElement('img');
      im.src = def.src; im.alt = def.alt || ''; im.draggable = false;
      if (def.zoom) im.style.transform = `scale(${def.zoom})`;
      wrap.appendChild(im); el.appendChild(wrap);
      el.addEventListener('click', () => openLightbox(def.src, def.alt));
    } else {
      el = document.createElement('button'); el.type = 'button';
      el.className = 'node top';
      el.textContent = def.label;
      el.setAttribute('aria-expanded', 'false');
    }
    document.body.appendChild(el);
    const n = {
      el, def, parent, depth, kids: [], open: false, closing: false,
      x: parent.x, y: parent.y, tx: parent.x, ty: parent.y, dx: parent.x, dy: parent.y,
      s: 0, dim: 1, appearAt: now() + delay, phase: Math.random() * 6.28,
      w: el.offsetWidth || 60, h: el.offsetHeight || 18,
      z: 0, fx: 0, fy: 0,    // z = depth; top-level: random place as a fraction of the screen
      ox: 0, oy: 0           // child: random offset from its parent
    };
    if (depth === 0) el.addEventListener('click', () => toggleBranch(n));
    nodes.push(n);
    return n;

  const hit = (ax, ay, aw, ah, bx, by, bw, bh, pad) =>
    Math.abs(ax - bx) < (aw + bw) / 2 + pad && Math.abs(ay - by) < (ah + bh) / 2 + pad;
  const mx = n => n.w * 0.6 + 8, my = n => n.h * 0.6 + 8;
  const place = (n, x, y) => { n.tx = clamp(x, mx(n), W - mx(n)); n.ty = clamp(y, Math.max(my(n), 64), H - my(n)); };

  // everything lands at random: top-level anywhere on the screen, children around their parent
  function scatterTop(n) {
    let best = null;
    for (let k = 0; k < 80; k++) {
      // a compact cloud around the nick, not the whole screen
      const a = rnd(0, 6.2832), rr = rnd(0.5, 1);
      const narrow = W < 600;                       // phones: a taller, wider cloud so words don't pile up
      const fx = 0.5 + Math.cos(a) * rr * (narrow ? 0.36 : Math.min(0.3, 340 / W));
      const fy = 0.5 + Math.sin(a) * rr * (narrow ? 0.34 : Math.min(0.28, 230 / H));
      const x = fx * W, y = fy * H;
      let ok = !hit(x, y, n.w, n.h, W / 2, H / 2, 120, 60, 40);
      for (const o of tops) if (o !== n && o.fx && hit(x, y, n.w, n.h, o.tx, o.ty, o.w, o.h, W < 600 ? 14 : 50)) ok = false;
      best = { fx, fy };
      if (ok) break;
    }
    n.fx = best.fx; n.fy = best.fy;
    n.z = rnd(-0.5, 0.5);
    place(n, n.fx * W, n.fy * H);
  }
  function scatterKid(c, p) {
    let best = null;
    for (let k = 0; k < 100; k++) {
      const a = rnd(0, 6.2832), r = rnd(W < 600 ? 75 : 55, (W < 600 ? 105 : 85) + k * 3);
      const x = clamp(p.tx + Math.cos(a) * r, mx(c), W - mx(c));
      const y = clamp(p.ty + Math.sin(a) * r, Math.max(my(c), 64), H - my(c));
      let ok = !hit(x, y, c.w, c.h, W / 2, H / 2, 70, 24, 10);
      for (const o of nodes) {
        if (o === c || o.closing || o.s === undefined) continue;
        if (o.depth === 0 && !tops.includes(o)) continue;
        if (hit(x, y, c.w, c.h, o.tx, o.ty, o.w, o.h, 10)) { ok = false; break; }
      }
      best = { a, r };
      if (ok) break;
    }
    c.z = rnd(0.6, 1);     // branches sit a little in front of their parent
    c.ox = Math.cos(best.a) * best.r; c.oy = Math.sin(best.a) * best.r;
    place(c, p.tx + c.ox, p.ty + c.oy);
  }

  function closeBranch(n) {

  function toggleBranch(n) {
    if (n.open) { closeBranch(n); setFocus(null); return; }

    n.open = true;
    n.el.setAttribute('aria-expanded', 'true');
    n.el.classList.add('focus');
    n.kids = n.def.kids.map((d, i) => makeNode(d, n, 1, i * 0.04));
    n.kids.forEach(c => scatterKid(c, n));
    setFocus(n);
  }

  // ---- per-frame update
  function updateNodes(dt, t) {
    const k = 1 - Math.exp(-dt * 16);
    const kd = 1 - Math.exp(-dt * 20);
    const tNow = now();
    mouse.x += (mouse.tx - mouse.x) * 0.08;
    mouse.y += (mouse.ty - mouse.y) * 0.08;
    hubNode.x = hubNode.dx = W / 2; hubNode.y = hubNode.dy = H / 2;

    // the focus: everything except the focused thing steps back
    const hubTarget = (!menuOpen || !focus) ? 1 : 0.22;
    hubDim += (hubTarget - hubDim) * kd;
    const sy = window.scrollY || 0;
    pageFade = 1 - clamp(sy / (H * 0.55));
    p2Fade = clamp((sy - H * 0.35) / (H * 0.5));
    if (hubReady) {
      hub.style.opacity = hubDim * pageFade;
      hub.style.pointerEvents = pageFade < 0.5 ? 'none' : 'auto';
    }
    p2.style.opacity = p2Fade;
    p2.style.pointerEvents = p2Fade > 0.6 ? 'auto' : 'none';
    hint.style.opacity = menuOpen ? pageFade * 0.9 : 0;

    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (tNow < n.appearAt) { n.x = n.dx = n.parent.dx; n.y = n.dy = n.parent.dy; continue; }
      let st = 1;
      if (n.closing) { n.tx = n.parent.x; n.ty = n.parent.y; st = 0; }
      n.x += (n.tx - n.x) * k;
      n.y += (n.ty - n.y) * k;
      n.s += (st - n.s) * Math.min(1, k * 1.2);
      if (n.closing && n.s < 0.04) { n.el.remove(); nodes.splice(i, 1); continue; }

      const dimTarget = (n.depth === 0 && focus && focus !== n) ? 0.22 : 1;
      n.dim += (dimTarget - n.dim) * kd;
      // depth: nearer things drift more with the mouse, are a bit bigger and a bit sharper
      n.dx = n.x + Math.sin(t * 0.8 + n.phase) * 1.5 * n.s + mouse.x * n.z * 22;
      n.dy = n.y + Math.cos(t * 0.7 + n.phase) * 1.5 * n.s + mouse.y * n.z * 16;
      const st2 = n.el.style;
      st2.opacity = clamp(n.s * 1.3) * n.dim * (0.8 + 0.2 * (n.z + 1) / 2) * pageFade;
      st2.transform = `translate(${n.dx}px, ${n.dy}px) translate(-50%, -50%) scale(${(0.5 + 0.5 * n.s) * (1 + n.z * 0.14)})`;
      st2.pointerEvents = (n.closing || n.s < 0.6 || pageFade < 0.5) ? 'none' : 'auto';
    }
  }

  // one thin line from J4J4J4 to every top-level word, nothing else is connected
  function drawLines() {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    for (const n of nodes) {
      if (n.depth !== 0 && !n.parent.def.linkKids) continue;
      const al = n.s * n.dim * pageFade;
      if (al < 0.02) continue;
      ctx.globalAlpha = al * 0.4;
      ctx.beginPath();
      ctx.moveTo(n.parent.dx, n.parent.dy);
      ctx.lineTo(n.dx, n.dy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  const card = document.getElementById('card');
  const spHost = document.getElementById('sphost');
  const cEl = {
    img: card.querySelector('img'), h: card.querySelector('h2'), sub: card.querySelector('.sub'),
    body: card.querySelector('.body')
  };
  let curCard = null, playing = false, soundOn = true;

  // the three labels, scattered a little (same chaos as the rest)
  const p2Items = {};
  [['info', 0.24, 0.2], ['history', 0.5, 0.15], ['future', 0.76, 0.22]].forEach(([k, x, y]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pi'; b.textContent = CARDS[k].title;
    b.setAttribute('aria-expanded', 'false');
    b.style.left = (x * 100 + rnd(-3, 3)) + '%';
    b.style.top = (y * 100 + rnd(-3, 3)) + '%';
    b.addEventListener('click', () => curCard === k ? closeCard() : openCard(k));
    p2.appendChild(b);
    p2Items[k] = b;
  });

  function jelly() {
    card.classList.remove('jelly');
    void card.offsetWidth;
    card.classList.add('jelly');
  }
  function openCard(k) {
    stopMusic();
    curCard = k;
    card.classList.add('locked');          // empty white box + play until the button is pressed
    const c = CARDS[k];
    cEl.img.src = c.img; cEl.img.style.objectPosition = c.pos;
    cEl.h.textContent = c.title; cEl.sub.textContent = c.sub; cEl.body.textContent = c.body;
    Object.keys(p2Items).forEach(i => p2Items[i].setAttribute('aria-expanded', String(i === k)));
    card.style.visibility = 'visible';
    jelly();
  }
  function closeCard() {
    stopMusic();
    curCard = null;
    card.style.visibility = 'hidden';
    card.classList.remove('jelly');
    Object.keys(p2Items).forEach(i => p2Items[i].setAttribute('aria-expanded', 'false'));
  }

  // --- music (official Spotify embed, driven by its iframe API)
  // The player is its own object: it flies out of the frame to a random spot and snaps back when stopped.
  // If sound is switched off, the player does not come out at all and nothing plays.
  let sp = null, spUri = null;
  const trackUri = u => { const m = (u || '').match(/(track|album)\/([A-Za-z0-9]+)/); return m ? 'spotify:' + m[1] + ':' + m[2] : null; };
  function withSpotify(cb) {
    if (window.__spApi) return cb(window.__spApi);
    window.onSpotifyIframeApiReady = api => { window.__spApi = api; cb(api); };
    if (!document.getElementById('sp-api')) {
      const s = document.createElement('script');
      s.id = 'sp-api'; s.src = 'https://open.spotify.com/embed/iframe-api/v1'; s.async = true;
      document.body.appendChild(s);
    }
  }
  function startMusic(k) {
    const uri = trackUri(TRACKS[k]);
    if (!uri) return false;
    withSpotify(api => {
      if (sp && spUri === uri) { sp.resume(); return; }
      if (sp) { spUri = uri; sp.loadUri(uri); setTimeout(() => sp.play(), 350); return; }
      spUri = uri;
      const slot = document.createElement('div');
      spHost.appendChild(slot);
      api.createController(slot, { uri, width: 300, height: 80 }, c => {
        sp = c;
        c.addListener('ready', () => c.play());
      });
    });
    return true;
  }
  function pauseMusic() { if (sp) { try { sp.pause(); } catch (e) {} } }

  const frameCenter = () => ({ x: W / 2, y: H * 0.56 });
  function playerTarget() {
    const c = frameCenter();
    let x, y;
    if (W >= 800) {                       // beside the frame, either side
      const side = Math.random() < 0.5 ? -1 : 1;
      x = c.x + side * (190 + 24 + rnd(0, 70)) + (side < 0 ? -300 : 0);
      y = c.y + rnd(-150, 110);
    } else {                              // narrow screen: below or above it
      x = rnd(10, Math.max(10, W - 310));
      y = Math.random() < 0.5 ? c.y + 190 + rnd(0, 30) : c.y - 190 - 80 - rnd(0, 30);
    }
    return { x: clamp(x, 8, W - 308), y: clamp(y, 8, H - 90) };
  }
  function showPlayer() {
    const c = frameCenter(), t = playerTarget();
    spHost.style.transition = 'none';
    spHost.classList.remove('on');
    spHost.style.left = (c.x - 150) + 'px';
    spHost.style.top = (c.y - 40) + 'px';
    void spHost.offsetWidth;
    spHost.style.transition = '';
    spHost.style.left = t.x + 'px';
    spHost.style.top = t.y + 'px';
    spHost.classList.add('on');
  }
  function hidePlayer() {
    const c = frameCenter();
    spHost.style.left = (c.x - 150) + 'px';
    spHost.style.top = (c.y - 40) + 'px';
    spHost.classList.remove('on');
  }

  function stopMusic() {
    if (playing) { playing = false; card.classList.remove('playing'); }
    clearTimeout(settleTimer);
    hidePlayer();
    pauseMusic();
  }

  // one sound switch for both speaker icons
  function setSoundIcon() {
    document.querySelectorAll('.s-on').forEach(e => e.style.display = soundOn ? '' : 'none');
    document.querySelectorAll('.s-off').forEach(e => e.style.display = soundOn ? 'none' : '');
  }
  function toggleSound() {
    soundOn = !soundOn;
    setSoundIcon();
    if (!playing) return;
    if (soundOn) { if (startMusic(curCard) && trackUri(TRACKS[curCard])) showPlayer(); }
    else { pauseMusic(); hidePlayer(); }
  }

  let settleTimer = 0;
  function togglePlay() {
    if (!curCard) return;
    if (playing) { stopMusic(); return; }
    playing = true;
    // the frame fills in with a jelly bounce, then keeps breathing while it plays
    card.classList.remove('locked');
    [card.querySelector('.ch'), cEl.body].forEach(el => { el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal'); });
    jelly();
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { card.classList.remove('jelly'); if (playing) card.classList.add('playing'); }, 720);
    if (soundOn && startMusic(curCard)) showPlayer();
  }
  document.getElementById('bigplay').addEventListener('click', togglePlay);

  // the player can be picked up by its handle and moved anywhere
  const spHandle = document.getElementById('sphandle');
  let grab = null;
  spHandle.addEventListener('pointerdown', e => {
    grab = { dx: e.clientX - spHost.offsetLeft, dy: e.clientY - p2.getBoundingClientRect().top - spHost.offsetTop };
    spHost.classList.add('drag');
    spHandle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  spHandle.addEventListener('pointermove', e => {
    if (!grab) return;
    const top = p2.getBoundingClientRect().top;
    spHost.style.left = clamp(e.clientX - grab.dx, 0, W - 300) + 'px';
    spHost.style.top = clamp(e.clientY - top - grab.dy, 16, H - 80) + 'px';
  });
  const drop = () => { grab = null; spHost.classList.remove('drag'); };
  spHandle.addEventListener('pointerup', drop);
  spHandle.addEventListener('pointercancel', drop);
  document.getElementById('bigsnd').addEventListener('click', toggleSound);

  // ================= loop =================
  let last = performance.now() / 1000;
  function frame(ms) {
    const t = ms / 1000;
    const dt = Math.min(0.05, Math.max(0.001, t - last)); last = t;
    ctx.clearRect(0, 0, W, H);
    drawDots(t);
    if (started) drawIntro(now());
    updateNodes(dt, t);
    drawLines();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
